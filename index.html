/* ── STORAGE ── */
const todayKey=()=>new Date().toISOString().slice(0,10);
const db={
  saveEntry:(tab,date,data)=>{try{const all=JSON.parse(localStorage.getItem("ba_entries_"+tab)||"{}");all[date]={...data,savedAt:new Date().toISOString()};localStorage.setItem("ba_entries_"+tab,JSON.stringify(all));}catch(e){}},
  loadEntry:(tab,date)=>{try{const all=JSON.parse(localStorage.getItem("ba_entries_"+tab)||"{}");return all[date]||null;}catch(e){return null;}},
  getDates:(tab)=>{try{const all=JSON.parse(localStorage.getItem("ba_entries_"+tab)||"{}");return Object.keys(all).sort((a,b)=>b.localeCompare(a));}catch(e){return[];}},
  getStreak:()=>({streak:JSON.parse(localStorage.getItem("ba_streak")||"0"),lastDate:localStorage.getItem("ba_lastDate")||"",total:JSON.parse(localStorage.getItem("ba_total")||"0")}),
  saveStreak:(s,d,t)=>{localStorage.setItem("ba_streak",s);localStorage.setItem("ba_lastDate",d);localStorage.setItem("ba_total",t);},
  getTheme:()=>localStorage.getItem("ba_theme")||"dark",
  saveTheme:(t)=>localStorage.setItem("ba_theme",t),
};

function useStreak(){
  const s=db.getStreak();
  const [streak,setStreak]=useState(s.streak);
  const [lastDate,setLastDate]=useState(s.lastDate);
  const [total,setTotal]=useState(s.total);
  const markToday=useCallback(()=>{
    const today=todayKey();
    if(lastDate===today)return;
    const diff=lastDate?Math.round((new Date(today)-new Date(lastDate))/86400000):1;
    const ns=diff===1?streak+1:1,nt=total+1;
    setStreak(ns);setLastDate(today);setTotal(nt);
    db.saveStreak(ns,today,nt);
  },[lastDate,streak,total]);
  return{streak,total,doneToday:lastDate===todayKey(),markToday};
}

function useAutoSave(tab,date,data){
  const [savedAt,setSavedAt]=useState(null);
  const timer=useRef(null);
  useEffect(()=>{
    if(!data)return;
    if(timer.current)clearTimeout(timer.current);
    timer.current=setTimeout(()=>{db.saveEntry(tab,date,data);setSavedAt(new Date());},800);
    return()=>clearTimeout(timer.current);
  },[JSON.stringify(data)]);
  return savedAt;
}

function HistoryDrawer({tab,currentDate,onSelect,onClose,T}){
