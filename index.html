/* ── STORAGE ── */
const todayKey=()=>new Date().toISOString().slice(0,10);
const db={
  saveEntry:(tab,date,data)=>{try{const all=JSON.parse(localStorage.getItem("ba_entries_"+tab)||"{}");all[date]={...data,savedAt:new Date().toISOString()};localStorage.setItem("ba_entries_"+tab,JSON.stringify(all));}catch(e){}},
  loadEntry:(tab,date)=>{try{const all=JSON.parse(localStorage.getItem("ba_entries_"+tab)||"{}");return all[date]||null;}catch(e){return null;}},
  getDates:(tab)=>{try{const all=JSON.parse(localStorage.getItem("ba_entries_"+tab)||"{}");return Object.keys(all).sort((a,b)=>b.localeCompare(a));}catch(e){return[];}},
  getStreak:()=>({streak:JSON.parse(localStorage.getItem("ba_streak")||"0"),lastDate:localStorage.getItem("ba_lastDate")||"",total:JSON.parse(localStorage.getItem("ba_total")||"0")}),
  saveStreak:(s,d,t)=>{localStorage.setItem("ba_streak",s);localStorage.setItem("ba_lastDate",d);localStorage.setItem("ba_total",t);},
  getTheme:()=>localStorage.getItem("ba_theme")||"dark",
  saveTheme:(t)=>localStorage.setItem("ba_theme",t),
};

function useStreak(){
  const s=db.getStreak();
  const [streak,setStreak]=useState(s.streak);
  const [lastDate,setLastDate]=useState(s.lastDate);
  const [total,setTotal]=useState(s.total);
  const markToday=useCallback(()=>{
    const today=todayKey();
    if(lastDate===today)return;
    const diff=lastDate?Math.round((new Date(today)-new Date(lastDate))/86400000):1;
    const ns=diff===1?streak+1:1,nt=total+1;
    setStreak(ns);setLastDate(today);setTotal(nt);
    db.saveStreak(ns,today,nt);
  },[lastDate,streak,total]);
  return{streak,total,doneToday:lastDate===todayKey(),markToday};
}

function useAutoSave(tab,date,data){
  const [savedAt,setSavedAt]=useState(null);
  const timer=useRef(null);
  useEffect(()=>{
    if(!data)return;
    if(timer.current)clearTimeout(timer.current);
    timer.current=setTimeout(()=>{db.saveEntry(tab,date,data);setSavedAt(new Date());},800);
    return()=>clearTimeout(timer.current);
  },[JSON.stringify(data)]);
  return savedAt;
}

/* ── HISTORY DRAWER ── */
function HistoryDrawer({tab,currentDate,onSelect,onClose,T}){
  const dates=db.getDates(tab);
  const fmtDate=d=>{
    const dt=new Date(d+"T12:00:00");
    const today=new Date();today.setHours(12,0,0,0);
    const yesterday=new Date(today);yesterday.setDate(today.getDate()-1);
    if(dt.toDateString()===today.toDateString())return"Today";
    if(dt.toDateString()===yesterday.toDateString())return"Yesterday";
    return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
  };
  const preview=(tab,date)=>{
    const e=db.loadEntry(tab,date);
    if(!e)return"No content";
    const fields=Object.values(e).filter(v=>typeof v==="string"&&v.length>10&&v!==e.savedAt);
    return(fields[0]||"").slice(0,80)+"...";
  };
  return React.createElement("div",{style:{position:"fixed",inset:0,zIndex:500,display:"flex",justifyContent:"flex-end"}},
    React.createElement("div",{onClick:onClose,style:{position:"absolute",inset:0,background:"rgba(0,0,0,0.5)",backdropFilter:"blur(4px)"}}),
    React.createElement("div",{style:{position:"relative",width:"min(360px,95vw)",height:"100%",background:T.histBg,borderLeft:`1px solid ${T.border}`,overflowY:"auto",display:"flex",flexDirection:"column"}},

        React.createElement("div",{style:{fontFamily:"'Montserrat',sans-serif",fontSize:11,color:T.txtFaded}},`${dates.length} entries saved on this device`)

      React.createElement("div",{style:{padding:"16px 20px",flex:1}},

          React.createElement("p",{style:{fontFamily:"'Montserrat',sans-serif",fontSize:12,color:T.txtFaded,marginTop:8}},"Start writing — your entries will appear here.")

          style:{padding:"14px 16px",borderRadius:14,marginBottom:10,cursor:"pointer",

            border:`1px solid ${date===currentDate?T.borderBr:T.border}`,transition:"all .2s"}},
          React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}},

            date===todayKey()&&React.createElement("span",{style:{fontFamily:"'Montserrat',sans-serif",fontSize:9,fontWeight:700,letterSpacing:1,color:T.accentLt,background:"rgba(115,57,96,0.15)",padding:"2px 8px",borderRadius:50}},"TODAY")
